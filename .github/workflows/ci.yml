name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-linux:
    name: Go build/vet/test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install restic, rclone, and sqlite3 (for integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y restic rclone sqlite3
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -race

  # Real per-release Ubuntu compatibility matrix for the installer and the
  # abm binary itself (not just "whatever ubuntu-latest happens to be"):
  # each leg runs inside that Ubuntu version's own container image, pulls
  # the already-built binary from the go-linux job, and exercises the
  # installer's dependency-download path plus a real doctor/backup/restore
  # cycle against a local destination. The 26.04 leg is best-effort: if that
  # image isn't published yet on the date this runs, it's expected to fail
  # and should be dropped from the matrix rather than treated as a real
  # regression.
  ubuntu-matrix:
    name: Ubuntu ${{ matrix.version }} install + smoke test
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version == '26.04' }}
    strategy:
      fail-fast: false
      matrix:
        version: ["20.04", "22.04", "24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates bzip2 unzip
      - name: Install a known-good Go toolchain
        # Ubuntu's own golang-go package is far too old on several supported
        # releases (Focal ships ~1.13, Jammy ~1.18) to build Go 1.22+ module
        # code at all -- it predates the log/slog package entirely. Installing
        # a pinned upstream Go tarball directly sidesteps that, the same way
        # install.sh pins restic/rclone instead of trusting apt's version.
        run: |
          GO_VERSION=1.22.9
          curl -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Build abm
        run: /usr/local/go/bin/go build -o /usr/local/bin/abm ./cmd/abm
      - name: Install restic and rclone via install.sh's own pinned-version logic
        run: |
          RESTIC_VERSION=0.19.1
          curl -fsSL -o /tmp/restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          bzip2 -d /tmp/restic.bz2
          install -m 0755 /tmp/restic /usr/local/bin/restic
          RCLONE_VERSION=1.75.1
          curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          install -m 0755 /tmp/rclone-v${RCLONE_VERSION}-linux-amd64/rclone /usr/local/bin/rclone
      - name: Smoke test setup -> backup -> restore
        run: |
          export ABM_HOME=/tmp/abmhome
          mkdir -p /tmp/source /tmp/dest
          echo hello > /tmp/source/file1.txt
          abm setup --non-interactive --device-name ci-ubuntu-${{ matrix.version }}
          abm storage add --provider local --name local --path /tmp/dest
          abm job add --name smoke --source /tmp/source --destination local
          abm backup now smoke
          abm snapshots smoke
          abm restore smoke latest --target /tmp/restore
          diff /tmp/source/file1.txt /tmp/restore/tmp/source/file1.txt

  # Real protocol-level integration tests (test/integration's
  # TestRealProvider_* tests): exercises ABM's actual job.Run/backend.Build
  # code against a real S3-compatible server and a real SFTP server,
  # catching bugs the pure-unit tests can't (two were found this way during
  # development -- see docs/TESTING.md: a hardcoded https:// scheme that
  # broke plain-HTTP servers, and a Windows-path/shell-escaping bug in the
  # SFTP sftp.command override). Uses adobe/s3mock rather than MinIO: MinIO's
  # Docker Hub images now require authentication to pull for any tag
  # (verified during this project's development), which would make this job
  # depend on credentials a public CI run can't have.
  protocol-integration:
    name: Real S3 + SFTP protocol integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - name: Start a disposable S3-compatible test server (adobe/s3mock)
        run: |
          docker run -d --name s3mock -p 9090:9090 -e initialBuckets=abmtest adobe/s3mock:latest
      - name: Start a disposable SFTP test server with a freshly generated key
        run: |
          mkdir -p /tmp/sftp-keys
          ssh-keygen -t ed25519 -f /tmp/sftp-keys/id_ed25519 -N "" -q
          chmod 600 /tmp/sftp-keys/id_ed25519
          docker run -d --name sftp-test -p 2222:22 \
            -v /tmp/sftp-keys/id_ed25519.pub:/home/abmtest/.ssh/keys/id_ed25519.pub:ro \
            -e SFTP_USERS="abmtest::1001:100:upload" \
            atmoz/sftp
      - name: Wait for test servers to be ready
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:9090/abmtest && break; sleep 1; done
          for i in $(seq 1 30); do nc -z localhost 2222 && break; sleep 1; done
      - name: Run real-provider integration tests
        env:
          ABM_TEST_S3_ENDPOINT: "http://localhost:9090"
          ABM_TEST_S3_ACCESS_KEY: "abmtest"
          ABM_TEST_S3_SECRET_KEY: "abmtestsecret"
          ABM_TEST_S3_BUCKET: "abmtest"
          ABM_TEST_SFTP_HOST: "localhost"
          ABM_TEST_SFTP_PORT: "2222"
          ABM_TEST_SFTP_USER: "abmtest"
          ABM_TEST_SFTP_KEY_FILE: "/tmp/sftp-keys/id_ed25519"
        run: go test ./test/integration/... -run TestRealProvider -v

  go-windows:
    name: Go build/vet/test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install restic and rclone (for integration tests)
        run: |
          choco install -y restic rclone sqlite
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  shellcheck:
    name: ShellCheck (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh"

  psscriptanalyzer:
    name: PSScriptAnalyzer (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize
          if ($results | Where-Object { $_.Severity -eq 'Error' }) {
            Write-Error "PSScriptAnalyzer found errors"
            exit 1
          }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
